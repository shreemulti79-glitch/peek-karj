/* ==========================================
   FIELD FUNCTION
========================================== */

function field(page,name,x,y,w,h,placeholder="",type="text"){

    let el;

    if(type==="textarea"){
        el=document.createElement("textarea");
    }else{
        el=document.createElement("input");
        el.type=type;
    }

    el.className="field";
    el.id=name;
    el.name=name;

    el.placeholder=placeholder;

    el.style.left=x+"%";
    el.style.top=y+"%";
    el.style.width=w+"%";
    el.style.height=h+"%";

    page.appendChild(el);

    return el;
}

/* ==========================================
   SAVE
========================================== */

function saveForm(){

    const data={};

    document
    .querySelectorAll(".field")
    .forEach(input=>{

        data[input.name]=input.value;

    });

    localStorage.setItem(
        "BOM_AGRICULTURE_FORM",
        JSON.stringify(data)
    );

    alert("✅ माहिती सेव्ह झाली.");

}


/* ==========================================
   LOAD
========================================== */

function loadData(){

    const saved=
        localStorage.getItem("BOM_AGRICULTURE_FORM");

    if(!saved) return;

    const data=JSON.parse(saved);

    Object.keys(data).forEach(key=>{

        const input=
            document.getElementById(key);

        if(input){
            input.value=data[key];
        }

    });

}


/* ==========================================
   CLEAR
========================================== */

function clearForm(){

    const ok=
        confirm(
            "सर्व भरलेली माहिती Delete करायची आहे का?"
        );

    if(!ok) return;

    localStorage.removeItem(
        "BOM_AGRICULTURE_FORM"
    );

    document
    .querySelectorAll(".field")
    .forEach(input=>{

        input.value="";

    });

}
