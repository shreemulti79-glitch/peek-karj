
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>लाभार्थी माहिती फॉर्म</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#eee;color:#111;
  font-family:"Noto Sans Devanagari",Arial,sans-serif;
}
.toolbar{
  display:flex;justify-content:center;gap:10px;
  padding:12px;flex-wrap:wrap;
}
button{
  padding:10px 16px;border:0;border-radius:5px;
  color:white;background:#1769d2;cursor:pointer;
}
.sheet{
  width:210mm;min-height:297mm;
  margin:0 auto;background:white;
  padding:9mm 10mm 12mm;
}
.info{width:100%;border-collapse:collapse;table-layout:fixed}
.info td{
  border:1px solid #555;height:7.2mm;
  padding:1mm 2mm;font-size:12px;
}
.info td:first-child{width:100%}
.info input{
  border:0;outline:0;width:100%;height:100%;
  font:inherit;background:transparent;color:#111;
}
.info .line{
  display:flex;align-items:center;gap:4px;
}
.info .line span{white-space:nowrap}
.photos{margin-top:0}
.photo-row{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:1mm;margin:0 2mm;
}
.person{min-width:0;text-align:center}
.photo{
  width:100%;height:34mm;border:1.4px solid #111;
  position:relative;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:white;
}
.photo img{
  width:100%;height:100%;object-fit:contain;
}
.hint{font-size:10px;color:#888;padding:2px}
.file{
  position:absolute;width:1px;height:1px;opacity:0;
}
.names{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  margin:2mm 0 5.5mm;min-height:6mm;
}
.names input{
  min-width:0;width:100%;height:6mm;
  border:1px solid #888;border-right:0;
  padding:1mm;font-size:10px;text-align:center;
}
.names input:last-child{border-right:1px solid #888}
.group-title{font-size:12px;margin:12mm 0 1.5mm}
.group{
  width:60%;height:61mm;margin-left:5mm;
  border:1.5px solid #111;position:relative;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:pointer;
}
.group img{width:100%;height:100%;object-fit:contain}
.group .hint{font-size:12px}
.signatures{
  display:flex;justify-content:space-between;
  margin:8mm 5mm 0;font-size:11px;
}
.signatures div{width:45%;text-align:center}
.signatures input{
  width:100%;border:0;border-bottom:1px solid transparent;
  outline:0;text-align:center;font:inherit;
}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:white}
  .toolbar,.screen-only{display:none!important}
  .sheet{margin:0;width:210mm;height:297mm;min-height:0;padding:9mm 10mm 12mm}
  input{color:#111!important}
  .photo,.group{cursor:default}
  .hint{display:none}
  .info input,.names input,.signatures input{
    print-color-adjust:exact;
  }
}
@media screen and (max-width:700px){
  .sheet{width:100%;min-height:0;padding:12px}
  .photo{height:25vw;min-height:65px}
  .names input{font-size:9px}
  .group{height:180px;width:75%}
  .info td{font-size:10px}
}
</style>
</head>

<body>
<div class="toolbar">
  <button onclick="window.print()">प्रिंट / PDF डाउनलोड</button>
  <button onclick="resetForm()">फॉर्म रिकामा करा</button>
</div>

<main class="sheet">

<table class="info">
<tbody>
<tr><td><div class="line"><span>गावाचे नाव:</span><input aria-label="गावाचे नाव" placeholder="मौजे, तालुका, जिल्हा"></div></td></tr>
<tr><td><div class="line"><span>लाभार्थी नाव:</span><input aria-label="लाभार्थी नाव"></div></td></tr>
<tr><td><div class="line"><span>Work Code:-</span><input aria-label="Work Code"></div></td></tr>
<tr><td><div class="line"><span>रोजगार सेवक / Attandance taker:-</span><input aria-label="रोजगार सेवक"></div></td></tr>
<tr><td><div class="line"><span>युजर ID :-</span><input aria-label="युजर ID"></div></td></tr>
<tr><td><div class="line"><span>Pass Word :-</span><input aria-label="Password"></div></td></tr>
<tr><td><div class="line"><span>लाभार्थी फोटो :-</span><input aria-label="लाभार्थी फोटो तपशील"></div></td></tr>
<tr><td><div class="line"><span>Latitude :</span><input aria-label="Latitude"></div></td></tr>
<tr><td><div class="line"><span>Longitude :</span><input aria-label="Longitude"></div></td></tr>
</tbody>
</table>

<div class="photos">
  <div class="photo-row" id="row1"></div>
  <div class="names" id="names1"></div>
  <div class="photo-row" id="row2"></div>
  <div class="names" id="names2"></div>
</div>

<div class="group-title">ग्रुप फोटो</div>

<label class="group" id="groupBox" for="groupUpload">
  <span class="hint">ग्रुप फोटो अपलोड करण्यासाठी क्लिक करा</span>
  <input class="file" id="groupUpload" type="file" accept="image/*">
</label>

<div class="signatures">
  <div><input aria-label="लाभार्थी सही" placeholder="लाभार्थी सही"></div>
  <div><input aria-label="रोजगार सेवक सही" placeholder="रोजगार सेवक / Attandance Takar"></div>
</div>

</main>

<script>
function createPerson(rowId,nameId,index){
  const person=document.createElement('div');
  person.className='person';

  const box=document.createElement('label');
  box.className='photo';
  box.htmlFor='personFile'+index;

  const hint=document.createElement('span');
  hint.className='hint';
  hint.textContent='फोटो अपलोड';
  box.appendChild(hint);

  const file=document.createElement('input');
  file.type='file';
  file.accept='image/*';
  file.className='file screen-only';
  file.id='personFile'+index;
  file.addEventListener('change',()=>{
    if(file.files && file.files[0]){
      showImage(file.files[0],box);
    }
  });

  person.append(box,file);
  document.getElementById(rowId).appendChild(person);

  const name=document.createElement('input');
  name.type='text';
  name.placeholder='नाव';
  name.setAttribute('aria-label','सदस्य '+index+' नाव');
  document.getElementById(nameId).appendChild(name);
}

function showImage(file,box){
  if(!file.type.startsWith('image/')){
    alert('कृपया फोटो निवडा.');
    return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
    const img=document.createElement('img');
    img.src=reader.result;
    img.alt='अपलोड केलेला फोटो';
    box.replaceChildren(img);
  };
  reader.readAsDataURL(file);
}

for(let i=1;i<=5;i++) createPerson('row1','names1',i);
for(let i=6;i<=10;i++) createPerson('row2','names2',i);

document.getElementById('groupUpload').addEventListener('change',function(){
  if(this.files && this.files[0]){
    showImage(this.files[0],document.getElementById('groupBox'));
  }
});

function resetForm(){
  if(!confirm('सर्व माहिती, नावे आणि फोटो रिकामे करायचे आहेत?')) return;
  document.querySelectorAll('.info input,.names input,.signatures input')
    .forEach(el=>el.value='');

  document.querySelectorAll('.person input[type=file]')
    .forEach(el=>el.value='');

  document.querySelectorAll('.person .photo').forEach(box=>{
    box.replaceChildren();
    const hint=document.createElement('span');
    hint.className='hint';
    hint.textContent='फोटो अपलोड';
    box.appendChild(hint);
  });

  const group=document.getElementById('groupBox');
  group.replaceChildren();
  const hint=document.createElement('span');
  hint.className='hint';
  hint.textContent='ग्रुप फोटो अपलोड करण्यासाठी क्लिक करा';
  group.appendChild(hint);
  document.getElementById('groupUpload').value='';
}
</script>
</body>
</html>
