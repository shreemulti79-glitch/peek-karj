<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>शेती कर्ज अर्ज - Bank of Maharashtra</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#e5e5e5;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
}

.topbar{
    position:sticky;
    top:0;
    z-index:9999;
    background:#075ca8;
    color:white;
    padding:12px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.topbar button{
    border:0;
    padding:10px 18px;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.btn-blue{
    background:white;
    color:#075ca8;
}

.btn-green{
    background:#16a34a;
    color:white;
}

.btn-red{
    background:#dc2626;
    color:white;
}

#formContainer{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 0;
}

/* प्रत्येक PDF Page */

.page{
    position:relative;
    background:white;
    margin-bottom:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
    width:794px;
    height:1123px;
}

.page canvas{
    width:100%;
    height:100%;
    display:block;
}

.field{
    position:absolute;
    border:1px solid #222;
    background:rgba(255,255,255,.88);
    padding:3px 5px;
    font-size:13px;
    color:#111;
    outline:none;
    border-radius:2px;
}

.field:focus{
    border:2px solid #0875d1;
    background:white;
}

.small{
    font-size:11px;
}

.center{
    text-align:center;
}

textarea.field{
    resize:none;
}

@media(max-width:850px){

    .page{
        width:96vw;
        height:calc(96vw * 1.4142);
    }

    .field{
        font-size:10px;
        padding:2px;
    }

}

@media print{

    body{
        background:white;
    }

    .topbar{
        display:none;
    }

    #formContainer{
        padding:0;
    }

    .page{
        width:210mm;
        height:297mm;
        margin:0;
        box-shadow:none;
        page-break-after:always;
    }

    .field{
        border:0;
        background:transparent;
        color:#000;
    }

}

</style>
</head>

<body>

<div class="topbar">

    <button class="btn-blue" onclick="saveData()">
        💾 माहिती सेव्ह
    </button>

    <button class="btn-green" onclick="window.print()">
        🖨️ Print / PDF
    </button>

    <button class="btn-red" onclick="clearData()">
        🗑️ Clear
    </button>

</div>

<div id="formContainer"></div>


<script>

/* ==========================================
   PDF SETTINGS
========================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const PDF_FILE = "PEEK-KARJ-FORM.pdf";

const container = document.getElementById("formContainer");


/* ==========================================
   FIELD CREATE FUNCTION
========================================== */

function addField(page, name, x, y, w, h, placeholder="", type="text"){

    let input;

    if(type === "textarea"){
        input = document.createElement("textarea");
    }else{
        input = document.createElement("input");
        input.type = type;
    }

    input.className = "field";
    input.name = name;
    input.id = name;

    if(placeholder){
        input.placeholder = placeholder;
    }

    input.style.left = x + "%";
    input.style.top = y + "%";
    input.style.width = w + "%";
    input.style.height = h + "%";

    page.appendChild(input);

    return input;
}


/* ==========================================
   PDF LOAD
========================================== */

async function loadPDF(){

    const pdf = await pdfjsLib.getDocument(PDF_FILE).promise;

    for(let pageNo = 1; pageNo <= pdf.numPages; pageNo++){

        const pdfPage = await pdf.getPage(pageNo);

        const viewport = pdfPage.getViewport({
            scale:1.5
        });

        const pageDiv = document.createElement("div");

        pageDiv.className = "page";
        pageDiv.id = "page" + pageNo;

        const canvas = document.createElement("canvas");

        const context = canvas.getContext("2d");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        pageDiv.appendChild(canvas);

        container.appendChild(pageDiv);

        await pdfPage.render({
            canvasContext:context,
            viewport:viewport
        }).promise;


        /*
        ========================================
        PAGE 1 FIELDS
        ========================================
        */

        if(pageNo === 1){

            addField(
                pageDiv,
                "applicant1",
                30, 25, 27, 3,
                "पहिला अर्जदार"
            );

            addField(
                pageDiv,
                "applicant2",
                30, 28, 27, 3,
                "दुसरा अर्जदार"
            );

            addField(
                pageDiv,
                "age1",
                67, 25, 12, 3,
                "वय"
            );

            addField(
                pageDiv,
                "age2",
                67, 28, 12, 3,
                "वय"
            );


            addField(
                pageDiv,
                "loanAmount",
                48, 41, 20, 3,
                "कर्ज रक्कम"
            );


            /* अर्जदाराचे नाव */

            addField(
                pageDiv,
                "member1",
                27, 57, 27, 3,
                "नाव"
            );

            addField(
                pageDiv,
                "member1age",
                67, 57, 12, 3,
                "वय"
            );

            addField(
                pageDiv,
                "member2",
                27, 62, 27, 3,
                "नाव"
            );

            addField(
                pageDiv,
                "member2age",
                67, 62, 12, 3,
                "वय"
            );


            /* कुटुंबातील सदस्य */

            addField(
                pageDiv,
                "family1",
                25, 73, 30, 3,
                "कुटुंब सदस्याचे नाव"
            );

            addField(
                pageDiv,
                "relation1",
                55, 73, 13, 3,
                "नाते"
            );

            addField(
                pageDiv,
                "income1",
                82, 73, 14, 3,
                "उत्पन्न"
            );


            addField(
                pageDiv,
                "family2",
                25, 77, 30, 3,
                "कुटुंब सदस्याचे नाव"
            );

            addField(
                pageDiv,
                "relation2",
                55, 77, 13, 3,
                "नाते"
            );

            addField(
                pageDiv,
                "income2",
                82, 77, 14, 3,
                "उत्पन्न"
            );


            addField(
                pageDiv,
                "familyHead",
                50, 86, 40, 3,
                "कुटुंब प्रमुखाचे नाव"
            );

        }


        /*
        ========================================
        PAGE 2
        ========================================
        */

        if(pageNo === 2){

            addField(
                pageDiv,
                "landArea",
                35, 30, 15, 3,
                "क्षेत्र"
            );

            addField(
                pageDiv,
                "surveyNo",
                52, 30, 15, 3,
                "गट नं."
            );

            addField(
                pageDiv,
                "crop1",
                25, 37, 25, 3,
                "पीक"
            );

            addField(
                pageDiv,
                "cropArea1",
                52, 37, 15, 3,
                "क्षेत्र"
            );

            addField(
                pageDiv,
                "crop2",
                25, 42, 25, 3,
                "पीक"
            );

            addField(
                pageDiv,
                "cropArea2",
                52, 42, 15, 3,
                "क्षेत्र"
            );

            addField(
                pageDiv,
                "crop3",
                25, 47, 25, 3,
                "पीक"
            );

            addField(
                pageDiv,
                "cropArea3",
                52, 47, 15, 3,
                "क्षेत्र"
            );

        }


        /*
        ========================================
        PAGE 3
        ========================================
        */

        if(pageNo === 3){

            addField(
                pageDiv,
                "address",
                28, 22, 60, 3,
                "पूर्ण पत्ता"
            );

            addField(
                pageDiv,
                "occupation",
                35, 29, 45, 3,
                "व्यवसाय"
            );

            addField(
                pageDiv,
                "bankAccount",
                35, 55, 30, 3,
                "बँक खाते क्रमांक"
            );

            addField(
                pageDiv,

            );

            );

        }


        /*
        ========================================
        PAGE 4
        ========================================
        */

        if(pageNo === 4){

            addField(
                pageDiv,
                "loanPurpose",
                25, 30, 65, 5,
                "कर्जाचा उद्देश",
                "textarea"
            );

            addField(
                pageDiv,
                "landDetails",
                25, 48, 65, 5,
                "जमिनीची माहिती",
                "textarea"
            );

            addField(
                pageDiv,
                "signature1",
                20, 78, 25, 3,
                "अर्जदार 1"
            );

            addField(
                pageDiv,
                "signature2",
                60, 78, 25, 3,
                "अर्जदार 2"
            );

        }


        /*
        ========================================
        PAGE 5
        ========================================
        */

        if(pageNo === 5){

            addField(
                pageDiv,
                "guarantor1",
                30, 35, 25, 3,
                "जामीनदार"
            );

            addField(
                pageDiv,
                "guarantorAccount",
                58, 35, 25, 3,
                "खाते क्रमांक"
            );

            addField(
                pageDiv,
                "date",
                25, 82, 20, 3,
                "दिनांक",
                "date"
            );

        }


        /*
        ========================================
        PAGE 6 - स्वयंघोषणापत्र
        ========================================
        */

        if(pageNo === 6){

            addField(
                pageDiv,
                "declarationName",
                30, 13, 35, 3,
                "अर्जदाराचे नाव"
            );

            addField(
                pageDiv,
                "declarationAge",
                72, 13, 12, 3,
                "वय"
            );

            addField(
                pageDiv,
                "declarationVillage",
                30, 23, 30, 3,
                "गाव"
            );

            addField(
                pageDiv,
                "declarationDate",
                25, 78, 25, 3,
                "दिनांक",
                "date"
            );

        }


        /*
        ========================================
        PAGE 7 - शपथपत्र
        ========================================
        */

        if(pageNo === 7){

            addField(
                pageDiv,
                "affidavitName",
                30, 13, 35, 3,
                "अर्जदाराचे नाव"
            );

            addField(
                pageDiv,
                "affidavitAge",
                72, 13, 12, 3,
                "वय"
            );

            addField(
                pageDiv,
                "affidavitVillage",
                30, 23, 30, 3,
                "गाव"
            );

            addField(
                pageDiv,
                "affidavitDate",
                25, 78, 25, 3,
                "दिनांक",
                "date"
            );

        }

    }

    loadSavedData();
}


/* ==========================================
   SAVE DATA
========================================== */

function saveData(){

    const fields = document.querySelectorAll(".field");

    let data = {};

    fields.forEach(field => {
        data[field.name] = field.value;
    });

    localStorage.setItem(
        "peekKarjForm",
        JSON.stringify(data)
    );

    alert("माहिती सेव्ह झाली.");
}


/* ==========================================
   LOAD SAVED DATA
========================================== */

function loadSavedData(){

    const saved = localStorage.getItem("peekKarjForm");

    if(!saved) return;

    const data = JSON.parse(saved);

    Object.keys(data).forEach(name => {

        const field = document.getElementById(name);

        if(field){
            field.value = data[name];
        }

    });

}


/* ==========================================
   CLEAR
========================================== */

function clearData(){

    if(!confirm("सर्व माहिती Delete करायची आहे का?")){
        return;
    }

    localStorage.removeItem("peekKarjForm");

    document.querySelectorAll(".field").forEach(field => {
        field.value = "";
    });

}


/* ==========================================
   START
========================================== */

loadPDF();

</script>

</body>
</html>
